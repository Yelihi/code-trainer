services:
  runner:
    image: ${TRAINER_BROKER_IMAGE:?Set the verified runner service image ID}
    container_name: code-trainer-broker
    restart: unless-stopped
    environment:
      TRAINER_MODE: local
      TRAINER_IMAGE: ${TRAINER_RUNTIME_IMAGE:?Set the approved runtime image ID}
      TRAINER_RUNTIME_MANIFEST: /config/runtimes.json
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    # VM loopback only. A single host SSH forward carries mTLS to this port.
    # Colima automatic port forwarding stays disabled.
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-tls:/tls:ro
      - runtimes:/config:ro
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '3'}
volumes:
  runner-tls:
    external: true
    name: ${TRAINER_RUNNER_TLS_VOLUME:-code-trainer-runner-tls}
  runtimes:
    external: true
    name: code-trainer-runtimes
